openapi: 3.0.3
info:
  title: AutomationStar Checkout API
  version: 1.0.0
  description: In-memory e-commerce API for account access, carts, and checkout.
servers:
  - url: http://localhost:3000
paths:
  /api/register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: Casey Nguyen }
                email: { type: string, format: email, example: casey@example.com }
                password: { type: string, minLength: 8, example: SecurePass123 }
      responses:
        '201':
          description: User registered
        '400': { description: Invalid input }
        '409': { description: Email is already registered }
  /api/login:
    post:
      summary: Log in and receive a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Login successful }
        '400': { description: Missing credentials }
        '401': { description: Invalid credentials }
  /api/cart:
    get:
      summary: View the authenticated user's cart and available products
      security:
        - bearerAuth: []
      responses:
        '200': { description: Cart and product catalog }
        '401': { description: Authentication required }
    post:
      summary: Add a product to the cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: { type: string, example: prod-001 }
                quantity: { type: integer, minimum: 1, maximum: 99, example: 2 }
      responses:
        '200': { description: Product added }
        '400': { description: Invalid quantity or input }
        '404': { description: Product not found }
  /api/cart/{productId}:
    delete:
      summary: Remove a product from the cart
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Product removed }
        '404': { description: Product is not in the cart }
  /api/checkout:
    post:
      summary: Place an order from the cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethod]
              properties:
                paymentMethod:
                  type: string
                  enum: [cash, credit_card]
      responses:
        '201': { description: Order created and cart cleared }
        '400': { description: Invalid payment method or empty cart }
        '401': { description: Authentication required }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
